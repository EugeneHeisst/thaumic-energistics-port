plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.148' }
version = '0.7.14'
group = 'dev.eugheist'
base { archivesName = 'thaumic-energistics-modern' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Local dependency overrides work with an untracked libs/ directory or explicit paths.
def localJar = { String propertyName, String environmentName, String defaultPath ->
    def configured = providers.gradleProperty(propertyName)
        .orElse(providers.environmentVariable(environmentName)).getOrElse(defaultPath)
    def dependency = file(configured)
    if (!dependency.isFile()) {
        throw new GradleException("Missing dependency ${dependency.name}. Set -P${propertyName}=path/to/file.jar or ${environmentName}; see README.md.")
    }
    dependency
}
def tc4Jar = localJar('tc4LocalJar', 'TC4_JAR', 'libs/tc4modern-0.17.179.jar')
def ae2Jar = localJar('ae2LocalJar', 'AE2_JAR', 'libs/appliedenergistics2-19.2.18.jar')
def guideMeJar = localJar('guideMeLocalJar', 'GUIDEME_JAR', 'libs/guideme-21.1.19.jar')

neoForge {
    version = '21.1.256'
    parchment { mappingsVersion = '2024.11.17'; minecraftVersion = '1.21.1' }
    runs {
        client { client(); gameDirectory = file('run-client') }
        auditClient {
            client()
            programArguments.addAll '--width', '1080', '--height', '900', '--quickPlaySingleplayer', 'TEInspection'
            gameDirectory = file('run-audit')
            systemProperty 'thaumicenergistics.audit', 'true'
        }
    }
    mods { thaumicenergistics { sourceSet sourceSets.main } }
}
dependencies {
    compileOnly files(tc4Jar, ae2Jar, guideMeJar)
    runtimeOnly files(tc4Jar, ae2Jar, guideMeJar)
}

jar { manifest { attributes('Implementation-Version': project.version, 'Implementation-Title': 'Thaumic Energistics') } }

repositories { maven { url = 'https://maven.blamejared.com'; content { includeGroup 'mezz.jei' } } }
def localJei = providers.gradleProperty('jeiLocalJar').orElse(providers.environmentVariable('JEI_JAR')).orNull
dependencies {
    if (localJei) {
        def jeiJar = localJar('jeiLocalJar', 'JEI_JAR', localJei)
        compileOnly files(jeiJar)
        if (providers.gradleProperty('withJei').getOrElse('false').toBoolean()) runtimeOnly files(jeiJar)
    } else {
        compileOnly 'mezz.jei:jei-1.21.1-common-api:19.57.0.451'
        compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.57.0.451'
        if (providers.gradleProperty('withJei').getOrElse('false').toBoolean()) runtimeOnly 'mezz.jei:jei-1.21.1-neoforge:19.57.0.451'
    }
}
